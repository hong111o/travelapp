<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E4D64">
<title>行程本 · Trip Book</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Chinese face only; Fraunces is vendored. Loaded non-blocking so being
     offline never holds up first paint — the system CJK font stands in. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<script src="assets/vendor/leaflet/leaflet.js"></script>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- ============ LIBRARY (trip list) ============ -->
<div id="view-library" class="view active">
  <header class="hero hero-lib">
    <div class="hero-inner">
      <div class="kicker">MY TRIPS</div>
      <h1>行程本</h1>
      <div class="dates">所有行程 · 離線可睇</div>
    </div>
    <svg class="wave" viewBox="0 0 1440 46" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,24 C240,44 480,4 720,20 C960,36 1200,10 1440,26 L1440,46 L0,46 Z" fill="#FAF6EF"/>
    </svg>
  </header>
  <div class="wrap">
    <div class="libactions">
      <button class="btn btn-primary" id="btn-new">＋ 新行程</button>
      <button class="btn" id="btn-import">⬆️ 匯入檔案</button>
      <button class="btn" id="btn-paste">📋 貼上 AI 行程</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden multiple>
    </div>

    <div class="card pastecard" id="paste-panel" hidden>
      <h2>📋 用 AI 整行程</h2>
      <p class="tinynote" style="margin-top:0">
        AI 預設會寫一大段文字，app 讀唔明。撳下面個掣 copy 一段提示俾 AI，
        佢就會吐返可以直接貼落嚟嘅資料。
      </p>
      <button class="btn btn-amber" id="btn-copy-prompt" style="width:100%;margin-top:10px">
        📋 copy 提示俾 AI
      </button>
      <textarea id="paste-box" class="jsonarea" style="min-height:34vh;margin-top:11px"
        spellcheck="false" placeholder="跟住喺度貼返 AI 俾你嘅嘢…
（有 ``` 或者前言都唔怕，會自動抽返出嚟）"></textarea>
      <div class="jsonerr" id="paste-err" hidden></div>
      <div class="pasterow">
        <button class="btn" id="btn-paste-cancel">取消</button>
        <button class="btn btn-primary" id="btn-paste-go">匯入</button>
      </div>
    </div>
    <div id="lib-list" class="daycards"></div>
    <div id="lib-empty" class="card empty" hidden>
      <h2>仲未有行程</h2>
      <p class="tinynote">撳「＋ 新行程」自己填，或者「匯入檔案」上載之前 export 咗嘅 <code>.json</code>。</p>
      <button class="btn" id="btn-restore-samples">載入示範行程</button>
    </div>
    <footer>行程本 · 資料存喺你部機 <span class="heart">✦</span></footer>
  </div>
</div>

<!-- ============ TRIP (rendered itinerary) ============ -->
<div id="view-trip" class="view"></div>

<!-- ============ EDITOR ============ -->
<div id="view-editor" class="view"></div>

<div id="toast" class="toast" hidden></div>

<script src="assets/js/util.js"></script>
<script src="assets/js/schema.js"></script>
<script src="assets/js/store.js"></script>
<script src="data/builtin.js"></script>
<script src="assets/js/aiprompt.js"></script>
<script src="assets/js/widgets.js"></script>
<script src="assets/js/offline.js"></script>
<script src="assets/js/photos.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/dragsort.js"></script>
<script src="assets/js/editor.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
