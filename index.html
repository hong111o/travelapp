<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E4756" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14222A" media="(prefers-color-scheme: dark)">
<title>Travel Marvel · 行程</title>
<link rel="icon" type="image/png" sizes="48x48" href="assets/icon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Travel Marvel">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Chinese face only; Fraunces is vendored. Loaded non-blocking so being
     offline never holds up first paint — the system CJK font stands in. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<script src="assets/vendor/leaflet/leaflet.js"></script>
<link rel="stylesheet" href="assets/css/app.css">
<script>
/* Resolve the theme before first paint: without this a phone set to dark
   flashes the light theme for as long as the scripts take to load. Kept
   inline and tiny for that reason. */
(function () {
  try {
    var set = localStorage.getItem('tripbook.theme');
    var dark = set ? set === 'dark'
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
</head>
<body>

<!-- ============ LIBRARY (trip list) ============ -->
<div id="view-library" class="view active">
  <header class="hero hero-lib">
    <div class="hero-inner">
      <div class="kicker">MY TRIPS</div>
      <h1>Travel&nbsp;Marvel</h1>
      <div class="dates">所有行程 · 離線可睇</div>
    </div>
    <svg class="wave" viewBox="0 0 1440 46" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,24 C240,44 480,4 720,20 C960,36 1200,10 1440,26 L1440,46 L0,46 Z" fill="currentColor"/>
    </svg>
  </header>
  <div class="wrap">
    <div class="libactions">
      <button class="btn btn-primary" id="btn-new">＋ 新行程</button>
      <button class="btn" id="btn-import">⬆️ 匯入檔案</button>
      <button class="btn" id="btn-paste">📋 貼上 AI 行程</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden multiple>
    </div>

    <div class="card pastecard" id="paste-panel" hidden>
      <h2>📋 用 AI 整行程</h2>
      <p class="tinynote" style="margin-top:0">
        AI 預設會寫一大段文字，app 讀唔明。撳下面個掣 copy 一段提示俾 AI，
        佢就會吐返可以直接貼落嚟嘅資料。
      </p>
      <div class="pasterow" style="margin-top:10px">
        <button class="btn btn-amber" id="btn-copy-prompt">📋 copy 提示</button>
        <button class="btn" id="btn-template">⬇️ 空白範本</button>
      </div>
      <p class="tinynote">
        想用對話嘅：撳「copy 提示」。想用檔案嘅：下載「空白範本」，
        send 俾 AI 叫佢當問卷咁填返。
      </p>
      <textarea id="paste-box" class="jsonarea" style="min-height:34vh;margin-top:11px"
        spellcheck="false" placeholder="跟住喺度貼返 AI 俾你嘅嘢…
（有 ``` 或者前言都唔怕，會自動抽返出嚟）"></textarea>
      <div class="jsonerr" id="paste-err" hidden></div>
      <div class="pasterow">
        <button class="btn" id="btn-paste-cancel">取消</button>
        <button class="btn btn-primary" id="btn-paste-go">匯入</button>
      </div>
    </div>
    <div id="lib-list" class="daycards"></div>
    <div id="lib-empty" class="card empty" hidden>
      <h2>仲未有行程</h2>
      <p class="tinynote">撳「＋ 新行程」自己填，或者「匯入檔案」上載之前 export 咗嘅 <code>.json</code>。</p>
      <button class="btn" id="btn-restore-samples">載入示範行程</button>
    </div>
    <footer>Travel Marvel <span id="app-ver"></span> · 資料存喺你部機 <span class="heart">✦</span><div class="footrow"><button class="btn btn-sm" id="btn-theme" aria-label="轉深色／淺色">🌙 深色</button><button class="btn btn-sm" id="btn-restore">↩️ 復原</button><button class="btn btn-sm" id="btn-update">🔄 檢查更新</button></div></footer>
  </div>
</div>

<!-- The trips page has its own bar: the general tools, as opposed to
     the trip tools in the bar inside a trip. A bottom bar on a phone and
     a sidebar on a desktop, from the same markup as the trip's bar.
     Entries marked sb-only are already on the page as buttons on a
     phone, so they only appear in the sidebar. -->
<nav class="tabbar libbar" aria-label="主要功能" hidden>
  <div class="sb-brand"><img src="assets/icon-192.png" alt="" width="40" height="40">
    <div><b>Travel Marvel</b><span>所有行程</span></div></div>
  <button class="tab on" data-lib="trips" aria-current="page"><span class="ti" aria-hidden="true">🗂️</span><span class="tl">行程</span></button>
  <button class="tab" data-lib="passport"><span class="ti" aria-hidden="true">🛂</span><span class="tl">護照</span></button>
  <button class="tab sb-only" data-lib="new"><span class="ti" aria-hidden="true">＋</span><span class="tl">新行程</span></button>
  <button class="tab sb-only" data-lib="paste"><span class="ti" aria-hidden="true">📋</span><span class="tl">貼上 AI 行程</span></button>
  <button class="tab sb-only" data-lib="import"><span class="ti" aria-hidden="true">⬆️</span><span class="tl">匯入檔案</span></button>
  <div class="sb-sep sb-only" role="presentation"></div>
  <button class="tab" data-lib="hotels"><span class="ti" aria-hidden="true">🏨</span><span class="tl">酒店比較</span></button>
  <button class="tab" data-lib="sync"><span class="ti" aria-hidden="true">☁️</span><span class="tl">同步</span><span class="syncdot" id="sync-dot" hidden></span></button>
  <button class="tab" data-lib="settings"><span class="ti" aria-hidden="true">⚙️</span><span class="tl">設定</span></button>
</nav>

<!-- ============ TRIP (rendered itinerary) ============ -->
<div id="view-trip" class="view"></div>

<!-- ============ PASSPORT ============ -->
<div id="view-passport" class="view"></div>

<!-- ============ EDITOR ============ -->
<div id="view-editor" class="view"></div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/js/util.js"></script>
<script src="assets/js/schema.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/sync.js"></script>
<script src="data/builtin.js"></script>
<script src="assets/js/aiprompt.js"></script>
<script src="assets/js/widgets.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/offline.js"></script>
<script src="assets/js/photos.js"></script>
<script src="assets/js/cover.js"></script>
<script src="assets/js/maps.js"></script>
<script src="assets/js/share.js"></script>
<script src="assets/js/geocode.js"></script>
<script src="assets/js/checkup.js"></script>
<script src="assets/js/hotels.js"></script>
<script src="assets/js/passport.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/dragsort.js"></script>
<script src="assets/js/editor.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
